# Render injects PORT automatically; 8080 is only used if PORT isn't set (e.g. running a jar manually)
server.port=${PORT:8080}

# ============================================================
# Database - Render PostgreSQL
# These all come from environment variables you set in the Render dashboard.
# Render's managed Postgres gives you a host, port, database name, user, and
# password separately (see the database's "Connect" tab) - plug those in as
# the env vars below rather than hardcoding anything here.
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Creates/updates tables automatically from the entity classes - no manual
# schema migration needed, and it never drops existing data.
spring.jpa.hibernate.ddl-auto=update

# Sample tour packages are seeded in code (see config/DataSeeder.java) only
# the very first time the packages table is empty - safe to redeploy/restart
# without ever duplicating rows.

spring.jpa.show-sql=false

# ============================================================
# CORS - comma-separated list of frontend origins allowed to call this API.
# Set this in Render's dashboard once your frontend is live, e.g.:
#   ALLOWED_ORIGINS=https://your-app.vercel.app
# Defaults to localhost so local development still works without setting anything.
# ============================================================
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
