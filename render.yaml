databases:
  - name: tour-booking-db
    plan: free
    databaseName: tourbooking
    user: tourbooking_user

services:
  - type: web
    name: tour-booking-backend
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/tour-booking-platform-1.0.0.jar
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: tour-booking-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tour-booking-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tour-booking-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: tour-booking-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tour-booking-db
          property: password
      # Update this to your live Vercel URL after you deploy the frontend,
      # then trigger a manual redeploy of this service.
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
